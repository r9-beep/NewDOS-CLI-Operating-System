[package]
name = "kernel"
version = "0.1.1"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"

[dependencies]
bootloader_api   = "0.11"
heapless         = { version = "0.8", default-features = false }
lazy_static      = { version = "1.4", features = ["spin_no_std"] }
linked_list_allocator = "0.10"
pc-keyboard      = "0.7"
pic8259          = "0.10"
spin             = "0.9"
x86_64           = "0.14"
uart_16550       = "0.3"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
